<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asma Hattab | Data & AI</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-soft: #e5e7eb;
      --chip-bg: #f3f4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #eef2ff 0, #f7f8fc 45%, #ffffff 100%);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    nav a {
      margin-left: 16px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    nav a:hover {
      color: var(--accent);
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.2fr);
      gap: 28px;
      align-items: center;
      margin-bottom: 40px;
    }

    @media (max-width: 820px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .hero {
        grid-template-columns: 1fr;
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.06);
      border: 1px solid rgba(79, 70, 229, 0.14);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .badge span {
      font-size: 0.9rem;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 3vw, 2.6rem);
      margin-bottom: 8px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      max-width: 460px;
    }

    .hero-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 0.9rem;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease,
        background 0.08s ease, border-color 0.08s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 13px 30px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.4);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.7);
      border-color: var(--border-soft);
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      background: white;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .hero-note {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Hero right card */
    .hero-card {
      background: linear-gradient(135deg, #ffffff, #f4f5ff);
      border-radius: 20px;
      padding: 22px 20px 20px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .hero-card-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .hero-card-main {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .hero-card-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--chip-bg);
      border: 1px solid rgba(79, 70, 229, 0.18);
    }

    .hero-list {
      list-style: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: grid;
      gap: 4px;
      margin-bottom: 4px;
    }

    .hero-list li::before {
      content: "• ";
      color: var(--accent);
      font-weight: 700;
    }

    /* Sections */
    section {
      margin-top: 32px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.1rem;
    }

    .section-kicker {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .section-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 560px;
      margin-bottom: 10px;
    }

    /* Cards & grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px 16px 18px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .card h3 {
      font-size: 0.98rem;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 0.87rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .pill {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    /* Timeline */
    .timeline {
      border-left: 2px solid rgba(148, 163, 184, 0.55);
      padding-left: 16px;
      margin-top: 4px;
    }

    .timeline-item {
      margin-bottom: 14px;
      position: relative;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 4px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
    }

    .timeline-role {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .timeline-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .timeline-desc {
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    /* Contact */
    .contact-box {
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      border-radius: 20px;
      padding: 20px 18px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 14px;
      align-items: center;
    }

    @media (max-width: 720px) {
      .contact-box {
        grid-template-columns: 1fr;
      }
    }

    .contact-box
